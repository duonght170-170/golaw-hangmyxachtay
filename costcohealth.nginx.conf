server {
    listen 80;
    listen [::]:80;
    server_name hangmyxachtay.info.vn www.hangmyxachtay.info.vn 103.97.126.82;
    return 301 https://hangmyxachtay.info.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hangmyxachtay.info.vn www.hangmyxachtay.info.vn;

    ssl_certificate /etc/letsencrypt/live/hangmyxachtay.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hangmyxachtay.info.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/costcohealth;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Clean URLs (e.g. /thanh-toan -> /thanh-toan.html, /admin -> /admin.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Reverse Proxy MCP Server (Port 3001) for GoClaw AI Agent
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Reverse Proxy Node.js Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static Assets Cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
